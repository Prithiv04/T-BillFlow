[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

solc_version = "0.8.25"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

# Linter warnings are reviewed and accepted as non-fatal for this project:
#  - block.timestamp: required for NAV freshness checks (RWAStateOracle)
#  - boolean-cst: cosmetic style in canExecute() helper returns
#  - reentrancy-events: emitted inside nonReentrant guards; safe by design
#  - arbitrary-send-erc20: gate-validated pull-deposit (TBillVault)
#  - missing-events-access-control: setExecutionGate is owner-only
#  - unused-return: isEligible() reverts on failure; return value not needed

[rpc_endpoints]
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"

[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", url = "https://api-sepolia.arbiscan.io/api" }
